<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>God Gamer Challenge - Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: #fff; }
    h1 { margin-bottom: 20px; }
    h2 { margin-bottom: 10px; color: #aaa; font-size: 14px; text-transform: uppercase; }
    .section { margin-bottom: 25px; padding: 15px; background: #2a2a2a; border-radius: 4px; }
    label { display: block; margin-bottom: 5px; color: #aaa; font-size: 12px; }
    input, select, textarea { 
      width: 100%; padding: 8px; background: #333; border: 1px solid #555; color: #fff; 
      border-radius: 4px; margin-bottom: 10px;
    }
    input[type="color"] { width: 60px; height: 35px; padding: 2px; cursor: pointer; }
    input[type="range"] { width: 100%; }
    .row { display: flex; gap: 15px; }
    .row > div { flex: 1; }
    .btn { 
      display: inline-block; padding: 8px 16px; background: #4da6ff; color: #fff; 
      border: none; border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    .btn:hover { background: #3d8fd9; }
    .btn-stop { background: #ff4d4d; }
    .btn-stop:hover { background: #cc3d3d; }
    .btn-success { background: #4dff4d; color: #000; }
    .btn-success:hover { background: #3dcc3d; }
    .btn-sm { padding: 4px 8px; font-size: 12px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { padding: 10px; border-radius: 4px; margin-bottom: 15px; }
    .status-inactive { background: #333; color: #aaa; }
    .status-active { background: #1a3a1a; color: #4dff4d; border: 1px solid #4dff4d; }
    .status-completed { background: #3a3a1a; color: #ff994d; border: 1px solid #ff994d; }
    .search-box { position: relative; }
    .search-results { 
      position: absolute; top: 100%; left: 0; right: 0; background: #333; 
      border: 1px solid #555; border-radius: 4px; max-height: 300px; overflow-y: auto; 
      z-index: 100; display: none;
    }
    .search-results.show { display: block; }
    .search-result-item { 
      padding: 10px; cursor: pointer; border-bottom: 1px solid #444; 
      display: flex; align-items: center; gap: 10px;
    }
    .search-result-item:hover { background: #444; }
    .search-result-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
    .game-list { list-style: none; }
    .game-item { 
      display: flex; align-items: center; gap: 10px; padding: 10px; 
      background: #333; border-radius: 4px; margin-bottom: 5px;
    }
    .game-item img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
    .game-item .game-info { flex: 1; }
    .game-item .game-name { font-weight: bold; }
    .game-item .game-platform { color: #aaa; font-size: 12px; }
    .game-item .game-result { 
      padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;
    }
    .game-item .game-result.win { background: #1a3a1a; color: #4dff4d; }
    .game-item .game-result.loss { background: #3a1a1a; color: #ff4d4d; }
    .game-item .game-result.current { background: #1a1a3a; color: #4da6ff; }
    .player-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .player-tag { 
      display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; 
      background: #444; border-radius: 4px; font-size: 12px;
    }
    .player-tag button { background: none; border: none; color: #aaa; cursor: pointer; }
    .player-tag button:hover { color: #ff4d4d; }
    .player-input-row { display: flex; gap: 5px; }
    .player-input-row input { flex: 1; margin-bottom: 0; }
    .toggle-css { 
      display: inline-block; padding: 4px 8px; background: #444; color: #aaa; 
      border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-bottom: 10px;
    }
    .toggle-css:hover { background: #555; }
    .css-editor { display: none; }
    .css-editor.show { display: block; }
    textarea { font-family: monospace; min-height: 100px; resize: vertical; }
    .preview { 
      padding: 20px; background: #000; border: 1px dashed #555; border-radius: 4px; 
      min-height: 100px; position: relative;
    }
    .preview-text { font-size: 32px; color: #fff; }
    .game-count { color: #aaa; font-size: 12px; margin-top: 5px; }
    .timer-controls { display: flex; gap: 10px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>God Gamer Challenge</h1>
  
  <div id="status" class="status status-inactive">
    Session Inactive - Create or start a session to begin
  </div>

  <div class="section">
    <h2>Session</h2>
    <div id="newSessionForm">
      <div class="row">
        <div>
          <label>Session Name</label>
          <input type="text" id="sessionName" value="God Gamer Session">
        </div>
        <div>
          <label>Game Cap</label>
          <input type="number" id="sessionCap" value="10" min="1" max="100">
        </div>
      </div>
      <div>
        <label>Players (comma-separated, defaults to devioussiddy)</label>
        <input type="text" id="sessionPlayers" placeholder="devioussiddy, player2, player3">
      </div>
      <button class="btn" onclick="createSession()">Create Session</button>
    </div>
    <div id="sessionControls" style="display: none;">
      <div class="timer-controls">
        <button class="btn btn-success" id="startBtn" onclick="startSession()">Start Session</button>
        <button class="btn btn-stop" id="stopBtn" onclick="stopSession()" style="display: none;">Stop Session</button>
        <span id="sessionTimer" style="font-size: 24px; margin-left: 20px;"></span>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Add Game</h2>
    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
      <input type="text" id="gameSearch" placeholder="Search for a game..." style="flex: 1; margin-bottom: 0;">
      <button class="btn" onclick="searchLocal()" id="localSearchBtn">Search Local</button>
      <button class="btn" onclick="searchTGDB()" id="tgdbSearchBtn">Search TGDB</button>
    </div>
    <div class="search-results" id="searchResults"></div>
    <div id="selectedGame" style="display: none; margin-top: 10px;">
      <div class="game-item">
        <img id="selectedGameImg" src="" alt="">
        <div class="game-info">
          <div class="game-name" id="selectedGameName"></div>
          <div class="game-platform" id="selectedGamePlatform"></div>
        </div>
        <button class="btn btn-sm" onclick="addGameToSession()">Add to Session</button>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Session Games <span id="gameCount" class="game-count"></span></h2>
    <ul class="game-list" id="gameList"></ul>
    <div id="noGames" style="color: #aaa; padding: 20px; text-align: center;">
      No games added yet. Search and add games above.
    </div>
  </div>

  <div class="section">
    <h2>Overlay Settings</h2>
    <div class="row">
      <div>
        <label>Font Size</label>
        <input type="number" id="fontSize" value="32" min="8" max="200">
      </div>
      <div>
        <label>Font Color</label>
        <input type="color" id="fontColor" value="#ffffff">
      </div>
      <div>
        <label>Font</label>
        <select id="font">
          <option value="Arial">Arial</option>
          <option value="Verdana">Verdana</option>
          <option value="Helvetica">Helvetica</option>
          <option value="Times New Roman">Times New Roman</option>
          <option value="Courier New">Courier New</option>
          <option value="Georgia">Georgia</option>
          <option value="Impact">Impact</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label>Background Color</label>
        <input type="color" id="backgroundColor" value="#000000">
      </div>
      <div>
        <label>Opacity</label>
        <input type="range" id="opacity" min="0" max="100" value="100" oninput="document.getElementById('opacityVal').textContent = this.value + '%'">
        <span id="opacityVal">100%</span>
      </div>
    </div>
    <div class="row">
      <div>
        <label>X Position</label>
        <input type="number" id="posX" value="100">
      </div>
      <div>
        <label>Y Position</label>
        <input type="number" id="posY" value="100">
      </div>
    </div>
    <div class="row">
      <div>
        <label><input type="checkbox" id="outlineEnabled"> Enable Text Outline</label>
      </div>
    </div>
    <div id="outlineSettings" style="display: none;">
      <div class="row">
        <div>
          <label>Outline Color</label>
          <input type="color" id="outlineColor" value="#000000">
        </div>
        <div>
          <label>Outline Width</label>
          <input type="number" id="outlineWidth" value="2" min="1" max="10">
        </div>
      </div>
    </div>
    <button class="toggle-css" onclick="toggleCSS()">Show CSS</button>
    <div class="css-editor">
      <label>Custom CSS</label>
      <textarea id="customCSS" placeholder="/* Custom CSS here */"></textarea>
    </div>
    <button class="btn" onclick="saveSettings()" style="margin-top: 10px;">Save Settings</button>
  </div>

  <div class="section">
    <h2>Preview</h2>
    <div class="preview" id="preview">
      <div class="preview-text" id="previewText">Session Preview</div>
    </div>
  </div>

  <script>
    let session = null;
    let selectedGameData = null;
    let localGames = [];

    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('id');

    async function init() {
      if (sessionId) {
        await loadSession(sessionId);
      } else {
        document.getElementById('newSessionForm').style.display = 'block';
        document.getElementById('sessionControls').style.display = 'none';
      }
      setupOutlineToggle();
      updatePreview();
    }

    function setupOutlineToggle() {
      document.getElementById('outlineEnabled').addEventListener('change', (e) => {
        document.getElementById('outlineSettings').style.display = e.target.checked ? 'block' : 'none';
        updatePreview();
      });
    }

    async function loadSession(id) {
      try {
        const res = await fetch('/api/godgamer/sessions/' + id);
        if (!res.ok) throw new Error('Not found');
        session = await res.json();
        
        document.getElementById('newSessionForm').style.display = 'none';
        document.getElementById('sessionControls').style.display = 'block';
        
        document.getElementById('sessionName').value = session.name;
        document.getElementById('sessionCap').value = session.cap;
        document.getElementById('sessionPlayers').value = (session.playerNames || []).join(', ');
        
        document.getElementById('fontSize').value = session.fontSize || 32;
        document.getElementById('fontColor').value = session.fontColor || '#ffffff';
        document.getElementById('font').value = session.font || 'Arial';
        document.getElementById('backgroundColor').value = session.backgroundColor || '#000000';
        document.getElementById('opacity').value = (session.opacity ?? 1) * 100;
        document.getElementById('opacityVal').textContent = ((session.opacity ?? 1) * 100) + '%';
        document.getElementById('posX').value = session.position?.x || 100;
        document.getElementById('posY').value = session.position?.y || 100;
        document.getElementById('outlineEnabled').checked = session.outlineEnabled || false;
        document.getElementById('outlineColor').value = session.outlineColor || '#000000';
        document.getElementById('outlineWidth').value = session.outlineWidth || 2;
        document.getElementById('customCSS').value = session.customCSS || '';
        
        document.getElementById('outlineSettings').style.display = session.outlineEnabled ? 'block' : 'none';
        
        updateStatus();
        renderGameList();
        updatePreview();
      } catch (e) {
        console.error('Failed to load session:', e);
      }
    }

    async function createSession() {
      const name = document.getElementById('sessionName').value || 'God Gamer Session';
      const cap = parseInt(document.getElementById('sessionCap').value) || 10;
      const playersStr = document.getElementById('sessionPlayers').value;
      const players = playersStr ? playersStr.split(',').map(p => p.trim()).filter(p => p) : [];

      try {
        const res = await fetch('/api/godgamer/sessions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, cap, players })
        });
        session = await res.json();
        
        window.history.replaceState({}, '', '?id=' + session.id);
        document.getElementById('newSessionForm').style.display = 'none';
        document.getElementById('sessionControls').style.display = 'block';
        
        updateStatus();
      } catch (e) {
        alert('Failed to create session');
      }
    }

    async function startSession() {
      if (!session) return;
      await fetch('/api/godgamer/sessions/' + session.id + '/start', { method: 'POST' });
      session.isActive = true;
      session.startedAt = Date.now();
      updateStatus();
    }

    async function stopSession() {
      if (!session) return;
      await fetch('/api/godgamer/sessions/' + session.id + '/stop', { method: 'POST' });
      session.isActive = false;
      session.endedAt = Date.now();
      updateStatus();
    }

    function updateStatus() {
      const statusEl = document.getElementById('status');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      
      if (session.isActive) {
        statusEl.className = 'status status-active';
        statusEl.textContent = 'Session Active - Playing game ' + (session.currentGameIndex + 1) + ' of ' + session.games.length;
        startBtn.style.display = 'none';
        stopBtn.style.display = 'inline-block';
      } else if (session.endedAt) {
        statusEl.className = 'status status-completed';
        statusEl.textContent = 'Session Completed';
        startBtn.style.display = 'inline-block';
        stopBtn.style.display = 'none';
      } else {
        statusEl.className = 'status status-inactive';
        statusEl.textContent = 'Session Inactive - Press Start to begin';
        startBtn.style.display = 'inline-block';
        stopBtn.style.display = 'none';
      }
    }

    async function searchLocal() {
      const query = document.getElementById('gameSearch').value.trim().toLowerCase();
      if (query.length < 2) {
        document.getElementById('searchResults').classList.remove('show');
        return;
      }

      try {
        const res = await fetch('/api/godgamer/games');
        localGames = await res.json();
        
        const filtered = localGames.filter(g => 
          g.name.toLowerCase().includes(query) || 
          (g.platform && g.platform.toLowerCase().includes(query))
        );
        
        const resultsEl = document.getElementById('searchResults');
        if (filtered.length === 0) {
          resultsEl.innerHTML = '<div style="padding: 10px; color: #aaa;">No local results. Try searching TGDB.</div>';
        } else {
          resultsEl.innerHTML = filtered.map(g => `
            <div class="search-result-item" onclick='selectGame(${JSON.stringify({ tgdbId: g.tgdbId, name: g.name, platform: g.platform, steamId: g.steamId, boxartUrl: g.boxartUrl }).replace(/'/g, "&#39;")})'>
              <img src="${g.boxartUrl || ''}" alt="" onerror="this.style.display='none'" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;">
              <div>
                <div>${g.name}</div>
                <div style="color: #aaa; font-size: 12px;">${g.platform || 'Unknown Platform'} | Played ${g.playCount || 0}x</div>
              </div>
            </div>
          `).join('');
        }
        resultsEl.classList.add('show');
      } catch (e) {
        console.error('Local search failed:', e);
      }
    }

    async function searchTGDB() {
      const query = document.getElementById('gameSearch').value.trim();
      if (query.length < 2) {
        alert('Type at least 2 characters to search');
        return;
      }

      const btn = document.getElementById('tgdbSearchBtn');
      btn.disabled = true;
      btn.textContent = 'Searching...';

      try {
        const res = await fetch('/api/godgamer/search?q=' + encodeURIComponent(query));
        const games = await res.json();
        
        const resultsEl = document.getElementById('searchResults');
        if (games.length === 0) {
          resultsEl.innerHTML = '<div style="padding: 10px; color: #aaa;">No results found on TGDB</div>';
        } else {
          resultsEl.innerHTML = games.map(g => `
            <div class="search-result-item" onclick='selectGame(${JSON.stringify(g).replace(/'/g, "&#39;")})'>
              <img src="${g.boxartUrl || ''}" alt="" onerror="this.style.display='none'" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;">
              <div>
                <div>${g.name}</div>
                <div style="color: #aaa; font-size: 12px;">${g.platform || 'Unknown Platform'}</div>
              </div>
            </div>
          `).join('');
        }
        resultsEl.classList.add('show');
      } catch (e) {
        console.error('TGDB search failed:', e);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Search TGDB';
      }
    }

    function selectGame(game) {
      selectedGameData = game;
      document.getElementById('selectedGame').style.display = 'block';
      document.getElementById('selectedGameImg').src = game.boxartUrl || '';
      document.getElementById('selectedGameImg').style.display = game.boxartUrl ? 'block' : 'none';
      document.getElementById('selectedGameName').textContent = game.name;
      document.getElementById('selectedGamePlatform').textContent = game.platform || 'Unknown Platform';
      document.getElementById('searchResults').classList.remove('show');
      document.getElementById('gameSearch').value = '';
    }

    async function addGameToSession() {
      if (!session || !selectedGameData) return;

      try {
        const res = await fetch('/api/godgamer/sessions/' + session.id + '/games', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            tgdbId: selectedGameData.tgdbId,
            name: selectedGameData.name,
            platform: selectedGameData.platform,
            steamId: selectedGameData.steamId || null,
            boxartUrl: selectedGameData.boxartUrl || null
          })
        });
        session = await res.json();
        
        selectedGameData = null;
        document.getElementById('selectedGame').style.display = 'none';
        renderGameList();
        updatePreview();
      } catch (e) {
        alert('Failed to add game');
      }
    }

    async function removeGame(gameId) {
      if (!session) return;
      try {
        const res = await fetch('/api/godgamer/sessions/' + session.id + '/games/' + gameId, {
          method: 'DELETE'
        });
        session = await res.json();
        renderGameList();
        updatePreview();
      } catch (e) {
        alert('Failed to remove game');
      }
    }

    async function startCurrentGame() {
      if (!session) return;
      try {
        const res = await fetch('/api/godgamer/sessions/' + session.id + '/games/current/start', {
          method: 'POST'
        });
        session = await res.json();
        renderGameList();
      } catch (e) {
        alert('Failed to start game');
      }
    }

    async function endCurrentGame(result) {
      if (!session) return;
      try {
        const res = await fetch('/api/godgamer/sessions/' + session.id + '/games/current/end', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ result })
        });
        session = await res.json();
        updateStatus();
        renderGameList();
        updatePreview();
      } catch (e) {
        alert('Failed to end game');
      }
    }

    function renderGameList() {
      const listEl = document.getElementById('gameList');
      const noGamesEl = document.getElementById('noGames');
      const countEl = document.getElementById('gameCount');
      
      if (!session || !session.games || session.games.length === 0) {
        listEl.innerHTML = '';
        noGamesEl.style.display = 'block';
        countEl.textContent = '';
        return;
      }

      noGamesEl.style.display = 'none';
      countEl.textContent = '(' + session.games.length + '/' + session.cap + ')';

      listEl.innerHTML = session.games.map((game, i) => {
        let resultClass = '';
        let resultText = '';
        
        if (game.result === 'win') {
          resultClass = 'win';
          resultText = 'WIN';
        } else if (game.result === 'loss') {
          resultClass = 'loss';
          resultText = 'LOSS';
        } else if (i === session.currentGameIndex && session.isActive) {
          resultClass = 'current';
          resultText = 'PLAYING';
        }

        return `
          <li class="game-item">
            <span style="color: #aaa; font-weight: bold; width: 25px;">${i + 1}.</span>
            <img src="${game.boxartUrl || ''}" alt="" onerror="this.style.display='none'">
            <div class="game-info">
              <div class="game-name">${game.name}</div>
              <div class="game-platform">${game.platform || ''}</div>
            </div>
            ${resultText ? `<span class="game-result ${resultClass}">${resultText}</span>` : ''}
            ${game.duration ? `<span style="color: #aaa; font-size: 12px;">${formatDuration(game.duration)}</span>` : ''}
            <button class="btn btn-sm btn-stop" onclick="removeGame('${game.id}')">X</button>
          </li>
        `;
      }).join('');
    }

    function formatDuration(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    async function saveSettings() {
      if (!session) return;

      const settings = {
        name: document.getElementById('sessionName').value,
        cap: parseInt(document.getElementById('sessionCap').value) || 10,
        fontSize: parseInt(document.getElementById('fontSize').value) || 32,
        fontColor: document.getElementById('fontColor').value,
        font: document.getElementById('font').value,
        backgroundColor: document.getElementById('backgroundColor').value,
        opacity: parseInt(document.getElementById('opacity').value) / 100,
        position: {
          x: parseInt(document.getElementById('posX').value) || 100,
          y: parseInt(document.getElementById('posY').value) || 100
        },
        outlineEnabled: document.getElementById('outlineEnabled').checked,
        outlineColor: document.getElementById('outlineColor').value,
        outlineWidth: parseInt(document.getElementById('outlineWidth').value) || 2,
        customCSS: document.getElementById('customCSS').value
      };

      try {
        const res = await fetch('/api/godgamer/sessions/' + session.id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(settings)
        });
        session = await res.json();
        updatePreview();
        alert('Settings saved!');
      } catch (e) {
        alert('Failed to save settings');
      }
    }

    function toggleCSS() {
      const editor = document.querySelector('.css-editor');
      editor.classList.toggle('show');
    }

    function updatePreview() {
      const preview = document.getElementById('preview');
      const previewText = document.getElementById('previewText');
      
      if (!session) {
        previewText.textContent = 'Session Preview';
        return;
      }

      const fontSize = document.getElementById('fontSize').value + 'px';
      const fontColor = document.getElementById('fontColor').value;
      const font = document.getElementById('font').value;
      const bgColor = document.getElementById('backgroundColor').value;
      const opacity = document.getElementById('opacity').value / 100;
      
      let outlineStyle = '';
      if (document.getElementById('outlineEnabled').checked) {
        const outlineColor = document.getElementById('outlineColor').value;
        const outlineWidth = document.getElementById('outlineWidth').value;
        outlineStyle = `text-shadow: -${outlineWidth}px -${outlineWidth}px 0 ${outlineColor}, ${outlineWidth}px -${outlineWidth}px 0 ${outlineColor}, -${outlineWidth}px ${outlineWidth}px 0 ${outlineColor}, ${outlineWidth}px ${outlineWidth}px 0 ${outlineColor};`;
      }

      preview.style.backgroundColor = bgColor;
      preview.style.opacity = opacity;
      previewText.style.fontSize = fontSize;
      previewText.style.color = fontColor;
      previewText.style.fontFamily = font;
      previewText.style.textShadow = outlineStyle ? outlineStyle.replace('text-shadow: ', '') : 'none';

      if (session.games && session.games.length > 0) {
        const gamesHtml = session.games.slice(0, 5).map((g, i) => {
          const result = g.result ? ` [${g.result.toUpperCase()}]` : (i === session.currentGameIndex && session.isActive ? ' [PLAYING]' : '');
          return `<div>${i + 1}. ${g.name}${result}</div>`;
        }).join('');
        previewText.innerHTML = gamesHtml;
      } else {
        previewText.textContent = 'No games added';
      }
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-results') && e.target.id !== 'gameSearch') {
        document.getElementById('searchResults').classList.remove('show');
      }
    });

    ['fontSize', 'fontColor', 'font', 'backgroundColor', 'opacity', 'outlineEnabled', 'outlineColor', 'outlineWidth'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', updatePreview);
    });

    init();
  </script>
</body>
</html>
