<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Scrolling Text Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: #fff; }
    h1 { margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, textarea, select { 
      width: 100%; padding: 8px; background: #333; border: 1px solid #555; 
      color: #fff; border-radius: 4px;
    }
    textarea { min-height: 80px; font-family: monospace; }
    .row { display: flex; gap: 15px; }
    .row .form-group { flex: 1; }
    .btn { 
      display: inline-block; padding: 10px 20px; background: #4da6ff; color: #fff; 
      border: none; border-radius: 4px; cursor: pointer; margin-right: 8px;
    }
    .btn-danger { background: #ff4d4d; }
    .btn-success { background: #4dff4d; color: #000; }
    .actions { margin-top: 20px; }
    .css-editor { display: none; margin-top: 15px; }
    .css-editor.show { display: block; }
    .toggle-css { 
      display: inline-block; padding: 8px 16px; background: #666; color: #fff; 
      border: none; border-radius: 4px; cursor: pointer; margin-top: 10px;
    }
    .preview { 
      margin-top: 20px; padding: 20px; background: #2a2a2a; border-radius: 4px;
      min-height: 80px;
    }
    .preview-text {
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .lines-editor { margin-top: 10px; }
    .line-item { display: flex; gap: 8px; margin-bottom: 8px; }
    .line-item input { flex: 1; }
    .line-item button { padding: 4px 8px; background: #ff4d4d; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    .add-line { margin-top: 8px; padding: 6px 12px; background: #4dff4d; color: #000; border: none; border-radius: 4px; cursor: pointer; }
    .checkbox-row { display: flex; gap: 20px; margin-bottom: 15px; }
    .checkbox-row label { display: inline-flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer; }
    .checkbox-row input[type="checkbox"] { width: auto; }
  </style>
</head>
<body>
  <h1>Scrolling Text Settings</h1>
  
  <form id="settingsForm">
    <div class="form-group">
      <label>Overlay Name</label>
      <input type="text" id="name" required>
    </div>

    <div class="form-group">
      <label>Text Lines</label>
      <div id="linesEditor" class="lines-editor"></div>
      <button type="button" class="add-line" onclick="addLine()">+ Add Line</button>
    </div>

    <div class="checkbox-row">
      <label><input type="checkbox" id="randomizeLines"> Randomize Lines</label>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Font Size (px)</label>
        <input type="number" id="fontSize" min="1" value="36">
      </div>
      <div class="form-group">
        <label>Scroll Speed (px/frame)</label>
        <input type="number" id="scrollSpeed" min="0.5" step="0.5" value="2">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Font Color</label>
        <input type="color" id="fontColor" value="#ffffff">
      </div>
      <div class="form-group">
        <label>Background Color</label>
        <input type="color" id="bgColor" value="#000000">
        <label><input type="checkbox" id="bgTransparent" checked> Transparent</label>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Outline Color</label>
        <input type="color" id="outlineColor" value="#000000">
        <label><input type="checkbox" id="outlineEnabled"> Enable Outline</label>
      </div>
      <div class="form-group">
        <label>Outline Width (px)</label>
        <input type="number" id="outlineWidth" min="0" max="20" value="2">
      </div>
    </div>

    <div class="form-group">
      <label>Opacity: <span id="opacityValue">100</span>%</label>
      <input type="range" id="opacity" min="0" max="100" value="100" style="width:100%">
    </div>

    <div class="row">
      <div class="form-group">
        <label>Separator</label>
        <input type="text" id="separator" value=" • ">
      </div>
      <div class="form-group">
        <label>Container Height (px)</label>
        <input type="number" id="containerHeight" min="20" value="50">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Position X</label>
        <input type="number" id="posX" value="0">
      </div>
      <div class="form-group">
        <label>Position Y</label>
        <input type="number" id="posY" value="0">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Font</label>
        <select id="font">
          <option value="Arial">Arial</option>
          <option value="Verdana">Verdana</option>
          <option value="Times New Roman">Times New Roman</option>
          <option value="Courier New">Courier New</option>
          <option value="Georgia">Georgia</option>
        </select>
      </div>
      <div class="form-group">
        <label>Text Align</label>
        <select id="textAlign">
          <option value="left" selected>Left</option>
          <option value="center">Center</option>
          <option value="right">Right</option>
        </select>
      </div>
    </div>

    <button type="button" class="toggle-css" onclick="toggleCSS()">Show CSS</button>
    
    <div class="css-editor" id="cssEditor">
      <div class="form-group">
        <label>Custom CSS</label>
        <textarea id="customCSS" placeholder="Enter custom CSS..."></textarea>
      </div>
    </div>

    <div class="actions">
      <button type="submit" class="btn">Save</button>
      <button type="button" class="btn btn-success" onclick="startOverlay()">Start</button>
      <button type="button" class="btn btn-danger" onclick="stopOverlay()">Stop</button>
      <button type="button" class="btn btn-danger" onclick="deleteOverlay()">Delete</button>
    </div>
  </form>

  <div class="preview">
    <h3>Preview</h3>
    <div id="previewText" class="preview-text"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const overlayId = params.get('id');
    let currentOverlay = null;
    let lines = ['Line 1', 'Line 2'];

    function toggleCSS() {
      document.getElementById('cssEditor').classList.toggle('show');
    }

    function renderLines() {
      const editor = document.getElementById('linesEditor');
      editor.innerHTML = lines.map((line, i) => `
        <div class="line-item">
          <input type="text" value="${line}" onchange="updateLine(${i}, this.value)" placeholder="Line ${i + 1}">
          <button type="button" onclick="removeLine(${i})">×</button>
        </div>
      `).join('');
    }

    function addLine() {
      lines.push('');
      renderLines();
    }

    function removeLine(index) {
      lines.splice(index, 1);
      renderLines();
    }

    function updateLine(index, value) {
      lines[index] = value;
    }

    function updatePreview() {
      const fontSize = document.getElementById('fontSize').value;
      const fontColor = document.getElementById('fontColor').value;
      const font = document.getElementById('font').value;
      const separator = document.getElementById('separator').value;
      const bgTransparent = document.getElementById('bgTransparent').checked;
      const bgColor = document.getElementById('bgColor').value;
      const outlineEnabled = document.getElementById('outlineEnabled').checked;
      const outlineColor = document.getElementById('outlineColor').value;
      const outlineWidth = document.getElementById('outlineWidth').value;
      const textAlign = document.getElementById('textAlign').value;
      const opacity = document.getElementById('opacity').value / 100;
      
      const preview = document.getElementById('previewText');
      
      const scrollText = lines.filter(l => l).join(separator);
      preview.textContent = scrollText;
      preview.style.fontSize = fontSize + 'px';
      preview.style.color = fontColor;
      preview.style.fontFamily = font;
      preview.style.textAlign = textAlign;
      preview.style.opacity = opacity;
      
      if (outlineEnabled) {
        preview.style.textShadow = `
          -${outlineWidth}px -${outlineWidth}px 0 ${outlineColor},
          ${outlineWidth}px -${outlineWidth}px 0 ${outlineColor},
          -${outlineWidth}px ${outlineWidth}px 0 ${outlineColor},
          ${outlineWidth}px ${outlineWidth}px 0 ${outlineColor}
        `;
      } else {
        preview.style.textShadow = 'none';
      }
      
      if (!bgTransparent) {
        preview.style.backgroundColor = bgColor;
        preview.style.padding = '10px';
      } else {
        preview.style.backgroundColor = 'transparent';
        preview.style.padding = '0';
      }
    }

    document.getElementById('opacity').addEventListener('input', (e) => {
      document.getElementById('opacityValue').textContent = e.target.value;
      updatePreview();
    });

    document.querySelectorAll('input, textarea, select').forEach(el => {
      el.addEventListener('input', updatePreview);
    });

    async function loadOverlay() {
      if (!overlayId) return;
      const res = await fetch('/api/scroll/' + overlayId);
      if (!res.ok) return;
      currentOverlay = await res.json();
      
      document.getElementById('name').value = currentOverlay.name;
      document.getElementById('fontSize').value = currentOverlay.fontSize;
      document.getElementById('fontColor').value = currentOverlay.fontColor;
      document.getElementById('scrollSpeed').value = currentOverlay.scrollSpeed;
      document.getElementById('separator').value = currentOverlay.separator;
      document.getElementById('containerHeight').value = currentOverlay.containerHeight;
      document.getElementById('posX').value = currentOverlay.position.x;
      document.getElementById('posY').value = currentOverlay.position.y;
      document.getElementById('font').value = currentOverlay.font;
      document.getElementById('textAlign').value = currentOverlay.textAlign || 'left';
      document.getElementById('outlineColor').value = currentOverlay.outlineColor || '#000000';
      document.getElementById('outlineEnabled').checked = currentOverlay.outlineEnabled || false;
      document.getElementById('outlineWidth').value = currentOverlay.outlineWidth || 2;
      document.getElementById('customCSS').value = currentOverlay.customCSS || '';
      document.getElementById('randomizeLines').checked = currentOverlay.randomizeLines || false;
      document.getElementById('opacity').value = (currentOverlay.opacity ?? 1) * 100;
      document.getElementById('opacityValue').textContent = ((currentOverlay.opacity ?? 1) * 100).toString();
      
      if (currentOverlay.backgroundColor !== 'transparent') {
        document.getElementById('bgTransparent').checked = false;
        document.getElementById('bgColor').value = currentOverlay.backgroundColor;
      }
      
      lines = currentOverlay.lines || ['Line 1', 'Line 2'];
      renderLines();
      updatePreview();
    }

    document.getElementById('settingsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        name: document.getElementById('name').value,
        lines: lines.filter(l => l),
        fontSize: parseInt(document.getElementById('fontSize').value),
        fontColor: document.getElementById('fontColor').value,
        backgroundColor: document.getElementById('bgTransparent').checked 
          ? 'transparent' 
          : document.getElementById('bgColor').value,
        scrollSpeed: parseFloat(document.getElementById('scrollSpeed').value),
        separator: document.getElementById('separator').value,
        containerHeight: parseInt(document.getElementById('containerHeight').value),
        position: { 
          x: parseInt(document.getElementById('posX').value), 
          y: parseInt(document.getElementById('posY').value) 
        },
        font: document.getElementById('font').value,
        textAlign: document.getElementById('textAlign').value,
        outlineColor: document.getElementById('outlineColor').value,
        outlineEnabled: document.getElementById('outlineEnabled').checked,
        outlineWidth: parseInt(document.getElementById('outlineWidth').value),
        opacity: document.getElementById('opacity').value / 100,
        customCSS: document.getElementById('customCSS').value,
        randomizeLines: document.getElementById('randomizeLines').checked
      };

      if (overlayId) {
        await fetch('/api/scroll/' + overlayId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } else {
        const res = await fetch('/api/scroll/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const newOverlay = await res.json();
        window.location.href = '/scroll-display?id=' + newOverlay.id;
        return;
      }
      alert('Saved!');
    });

    async function startOverlay() {
      if (!overlayId) return alert('Save first');
      await fetch('/api/scroll/' + overlayId + '/start', { method: 'POST' });
      alert('Started!');
    }

    async function stopOverlay() {
      if (!overlayId) return;
      await fetch('/api/scroll/' + overlayId + '/stop', { method: 'POST' });
      alert('Stopped!');
    }

    async function deleteOverlay() {
      if (!overlayId) return;
      if (!confirm('Delete this overlay?')) return;
      await fetch('/api/scroll/' + overlayId, { method: 'DELETE' });
      window.location.href = '/console';
    }

    renderLines();
    loadOverlay();
    updatePreview();
  </script>
</body>
</html>
